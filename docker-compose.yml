secrets:
  go_crt:
    file: ./secrets/go.crt
  go_key:
    file: ./secrets/go.key
  nginx_client_crt:
    file: ./secrets/nginx-client.crt
  nginx_client_key:
    file: ./secrets/nginx-client.key
  backend_ca:
    file: ./secrets/ca.crt
services:
  nginx-goapp-dev:
    profiles: ["dev"]
    image: nginx:alpine
    restart: unless-stopped
    secrets:
      - nginx_client_crt
      - nginx_client_key
      - backend_ca
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/upstream.dev.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./nginx/nginxconfig.io/proxy.conf:/etc/nginx/nginxconfig.io/proxy.conf:ro
      - ./nginx/nginxconfig.io/security.goapp.conf:/etc/nginx/nginxconfig.io/security.conf:ro
      - ./nginx/sites-available/goapp.dev.conf:/etc/nginx/sites-enabled/goapp.dev.conf:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro 
    ports:
      - "8080:8080"
    depends_on:
      psql:
        condition: service_healthy
      watch:
        condition: service_healthy
    networks:
      - app-network

  nginx-goapp-prod:
    profiles: ["prod"]
    image: nginx:alpine
    restart: unless-stopped
    secrets:
      - nginx_client_crt
      - nginx_client_key
      - backend_ca
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/upstream.prod.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./nginx/nginxconfig.io/proxy.conf:/etc/nginx/nginxconfig.io/proxy.conf:ro
      - ./nginx/nginxconfig.io/security.goapp.conf:/etc/nginx/nginxconfig.io/security.conf:ro
      - ./nginx/sites-available/goapp.prod.conf:/etc/nginx/sites-enabled/goapp.prod.conf:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro 
    ports:
      - "8080:8080"
    depends_on:
      psql:
        condition: service_healthy
      app:
        condition: service_healthy        
    networks:
      - app-network
  app:
    profiles: ["prod"]
    secrets:
      - go_crt
      - go_key
      - backend_ca
    expose:
      - "8443"
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
      TLS_PORT: ${TLS_PORT}
    depends_on:
      psql:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --no-check-certificate --certificate=/run/secrets/go_crt --private-key=/run/secrets/go_key https://localhost:8443/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      
  watch:
    secrets:
      - go_crt
      - go_key
      - backend_ca
    profiles: ["dev"]
    expose:
      - "8443"    
    build:
      context: .
      dockerfile: Dockerfile
      target: watch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
      TLS_PORT: ${TLS_PORT}
    volumes:
      - .:/app
      - air_tmp:/tmp/air
      - frontend_node_modules:/app/frontend-template/node_modules
    depends_on:
      psql:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --no-check-certificate --certificate=/run/secrets/go_crt --private-key=/run/secrets/go_key https://localhost:8443/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    profiles: ["prod", "dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginxconfig.io/security.conf:/etc/nginx/nginxconfig.io/security.conf:ro
      - ./nginx/sites-available/spa.staging.conf:/etc/nginx/sites-enabled/spa.staging.conf:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
    ports:
      - "5173:80"
    networks:
      - app-network

  psql:
    profiles: ["prod", "dev"]
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - psql_volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

volumes:
  psql_volume:
  frontend_node_modules:
  air_tmp:

networks:
  app-network: