name: Go-test
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --prefix ./frontend-template

      - name: Generate
        run: |
          make sqlc-generate
          make templ-generate
                  
      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build and Test
        run: make all