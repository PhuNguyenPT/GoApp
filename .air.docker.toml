root = "."
tmp_dir = "/tmp/air"

[build]
  entrypoint = "/tmp/air/main"
  cmd = "go tool sqlc generate && go tool templ generate && make tailwind-build js-build && go build -o /tmp/air/main ./cmd/api/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules", "frontend"]
  exclude_file = ["output.css"]
  exclude_regex = ["_test.go", "_templ.go", "internal/database/db.go", "internal/database/models.go", "internal/database/.*\\.sql\\.go"]
  include_dir = ["internal", "cmd", "frontend-template/public/styles", "frontend-template/public/scripts"]
  include_ext = ["go", "templ", "css", "sql", "js"]
  log = "build-errors.log"
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true