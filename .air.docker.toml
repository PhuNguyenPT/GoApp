root = "."
tmp_dir = "tmp"

[build]
  entrypoint = "./tmp/main"
  cmd = "go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate && go run github.com/a-h/templ/cmd/templ@latest generate && cd frontend-template && npx tailwindcss -i ./public/styles/index.css -o ./public/output.css && cd .. && go build -o ./tmp/main ./cmd/api/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules", "frontend"]
  exclude_file = ["output.css"]
  exclude_regex = ["_test.go", "_templ.go", "internal/database/db.go", "internal/database/models.go", "internal/database/.*\\.sql\\.go"]
  include_dir = ["internal", "cmd", "frontend-template/public/styles"]
  include_ext = ["go", "templ", "css", "sql"]
  log = "build-errors.log"
  stop_on_error = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true