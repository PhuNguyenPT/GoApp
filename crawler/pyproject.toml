[project]
name = "crawler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "scrapy",
    "scrapy-playwright",
    "fake-useragent",
    "psycopg2",
    "python-dotenv",
    "itemadapter",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]